<main class="flex flex-1 items-center justify-center px-4 py-10">
  <ime-window windowTitle="Sign in" class="w-full max-w-sm">
    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="font-ui flex flex-col gap-3 text-[13px] text-ink"
    >
      <label class="flex flex-col gap-1">
        Email
        <input
          class="retro-input"
          type="email"
          formControlName="email"
          autocomplete="email"
        />
      </label>
      <label class="flex flex-col gap-1">
        Password
        <input
          class="retro-input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </label>

      @if (error(); as message) {
        <p class="tooltip-well px-2 py-1.5 text-[12px] text-alert" role="alert">
          {{ message }}
        </p>
      }

      <div class="mt-1 flex flex-wrap items-center justify-between gap-2">
        <button class="retro-button font-bold" type="submit" [disabled]="busy()">
          {{ busy() ? 'Signing in…' : 'Sign in' }}
        </button>
        <a routerLink="/sign-up" class="retro-link text-[12px]"
          >New here? Create an account</a
        >
      </div>
    </form>
  </ime-window>
</main>
