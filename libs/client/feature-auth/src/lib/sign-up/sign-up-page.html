<main class="flex flex-1 items-center justify-center px-4 py-10">
  <ime-window windowTitle="Create account" class="w-full max-w-sm">
    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="font-ui flex flex-col gap-3 text-[13px] text-ink"
    >
      <label class="flex flex-col gap-1">
        Email
        <input
          class="retro-input"
          type="email"
          formControlName="email"
          autocomplete="email"
        />
      </label>
      <label class="flex flex-col gap-1">
        Password
        <input
          class="retro-input"
          type="password"
          formControlName="password"
          autocomplete="new-password"
        />
        <span class="font-retro-mono text-[11px] text-ink/60"
          >at least 8 characters</span
        >
      </label>
      <label class="flex flex-col gap-1">
        Confirm password
        <input
          class="retro-input"
          type="password"
          formControlName="confirm"
          autocomplete="new-password"
        />
      </label>

      @if (form.hasError('mismatch') && form.controls.confirm.touched) {
        <p class="tooltip-well px-2 py-1.5 text-[12px] text-alert" role="alert">
          Passwords do not match.
        </p>
      }
      @if (error(); as message) {
        <p class="tooltip-well px-2 py-1.5 text-[12px] text-alert" role="alert">
          {{ message }}
        </p>
      }

      <div class="mt-1 flex flex-wrap items-center justify-between gap-2">
        <button class="retro-button font-bold" type="submit" [disabled]="busy()">
          {{ busy() ? 'Creating…' : 'Create account' }}
        </button>
        <a routerLink="/sign-in" class="retro-link text-[12px]"
          >Already have an account? Sign in</a
        >
      </div>
    </form>
  </ime-window>
</main>
