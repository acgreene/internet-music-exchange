@for (win of manager.docked(); track win.id) {
  <button
    type="button"
    class="retro-button flex items-center gap-1.5 !py-1 text-[11px]"
    (click)="manager.restore(win.id)"
  >
    <span class="font-retro-mono text-[10px]" aria-hidden="true">{{
      win.state() === WindowState.Closed ? '✕' : '▁'
    }}</span>
    {{ win.title() }}
  </button>
}
