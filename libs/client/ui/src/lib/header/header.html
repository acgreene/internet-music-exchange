<header
  class="flex items-center justify-between border-b border-zinc-800 px-6 py-4"
>
  <span class="text-sm font-semibold uppercase tracking-widest"
    >Internet Music Exchange</span
  >
  <span class="flex items-center gap-2 text-xs text-zinc-400">
    <span
      class="h-2 w-2 rounded-full"
      [class.bg-emerald-400]="apiStatus() === 'online'"
      [class.bg-amber-400]="apiStatus() === 'checking'"
      [class.bg-rose-500]="apiStatus() === 'offline'"
    ></span>
    API {{ apiStatus() }}
  </span>
</header>
