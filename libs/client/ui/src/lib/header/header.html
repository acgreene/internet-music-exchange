<header
  class="bevel-out flex flex-wrap items-center justify-between gap-2 px-2 py-1.5"
>
  <a
    routerLink="/"
    class="retro-button inline-block text-[12px] font-bold uppercase tracking-widest no-underline"
  >
    Internet Music Exchange
  </a>

  <ime-taskbar class="min-w-0 flex-1 px-2" />

  <span class="flex flex-wrap items-center gap-2">
    <span class="tooltip-well flex items-center gap-1.5 px-2 py-1 text-[11px]">
      <span
        class="h-2 w-2 rounded-full"
        [class.bg-emerald-500]="apiStatus() === ApiStatus.Online"
        [class.bg-amber-400]="apiStatus() === ApiStatus.Checking"
        [class.bg-orange-500]="apiStatus() === ApiStatus.Degraded"
        [class.bg-rose-600]="apiStatus() === ApiStatus.Offline"
      ></span>
      API {{ apiStatus() }}
    </span>

    @if (user(); as signedIn) {
      <span class="tooltip-well hidden px-2 py-1 text-[11px] sm:inline">{{
        signedIn.email
      }}</span>
      <button type="button" class="retro-button" (click)="signOutSelected.emit()">
        Sign out
      </button>
    } @else {
      <a routerLink="/sign-in" class="retro-button no-underline">Sign in</a>
      <a routerLink="/sign-up" class="retro-button no-underline"
        >Create account</a
      >
    }
  </span>
</header>
