@if (listening()) {
  <iframe
    #frame
    title="Designer page"
    [src]="safeBundleUrl()"
    [style.height]="fill() ? '100%' : frameHeight() + 'px'"
    sandbox="allow-scripts"
    allow="fullscreen"
    referrerpolicy="no-referrer"
    width="100%"
    style="border: 0; display: block"
  ></iframe>
} @else {
  <div [style.height]="fill() ? '100%' : frameHeight() + 'px'"></div>
}
